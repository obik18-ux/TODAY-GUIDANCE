<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>


*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;
  color:#eee9df;
  background:
    radial-gradient(circle at 50% 0%, rgba(105,82,151,.34), transparent 35%),
    radial-gradient(circle at 15% 25%, rgba(52,92,130,.20), transparent 28%),
    linear-gradient(160deg,#090b18 0%,#111226 48%,#090b16 100%);
  min-height:100vh;
}

body:before{
  content:"✦     ·  ˚     ✧       ·     ✦       ˚     ·     ✧";
  position:fixed;
  top:20px;
  left:0;
  width:100%;
  text-align:center;
  color:rgba(235,211,150,.35);
  letter-spacing:18px;
  font-size:13px;
  pointer-events:none;
}

.container{
  max-width:980px;
  margin:0 auto;
  padding:42px 18px 70px;
}

h1{
  text-align:center;
  font-family:"Shippori Mincho","Yu Mincho",serif;
  font-size:clamp(28px,5vw,46px);
  font-weight:500;
  letter-spacing:.13em;
  margin:10px 0 8px;
  color:#f4dfaa;
  text-shadow:0 2px 18px rgba(225,192,112,.22);
}

.subtitle{
  text-align:center;
  color:#c9bdac;
  letter-spacing:.22em;
  font-size:14px;
  margin-bottom:30px;
}

.card{
  position:relative;
  background:linear-gradient(145deg,rgba(29,30,54,.94),rgba(14,15,31,.94));
  border:1px solid rgba(211,181,111,.28);
  border-radius:18px;
  padding:25px;
  margin:18px 0;
  box-shadow:
    0 14px 45px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.card:before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(211,181,111,.07);
  border-radius:13px;
  pointer-events:none;
}

h2{
  font-family:"Shippori Mincho","Yu Mincho",serif;
  font-size:21px;
  font-weight:500;
  letter-spacing:.09em;
  margin:0 0 16px;
  color:#e8d39d;
}

h3{
  margin:8px 0 13px;
  font-size:22px;
  font-weight:500;
  letter-spacing:.08em;
  color:#f0e7d5;
}

/* Language selector */
.language-bar{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:0 auto 22px;
}
.lang-btn{
  width:auto;
  min-width:105px;
  padding:9px 16px;
  font-size:14px;
  letter-spacing:.06em;
  color:#d8cfbf;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(211,181,111,.28);
  box-shadow:none;
}
.lang-btn.active{
  color:#f4dfaa;
  background:rgba(203,171,91,.10);
  border-color:rgba(242,211,137,.65);
  text-shadow:0 0 10px rgba(242,211,137,.24);
}

.input-row{
  display:flex;
  gap:13px;
  align-items:end;
  flex-wrap:wrap;
}

label{
  font-weight:500;
  display:block;
  margin-bottom:7px;
  color:#d6c9b5;
}

input[type=date]{
  padding:12px 13px;
  border:1px solid rgba(211,181,111,.45);
  border-radius:9px;
  font-family:inherit;
  font-size:17px;
  background:#0b0d1a;
  color:#eee9df;
  min-width:190px;
}

button{
  border:1px solid rgba(242,211,137,.48);
  border-radius:10px;
  padding:13px 23px;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  letter-spacing:.08em;
  cursor:pointer;
  color:#171421;
  background:linear-gradient(135deg,#e8ce8d,#b99858);
  box-shadow:0 5px 18px rgba(0,0,0,.25);
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.note{
  font-size:13px;
  color:#aaa396;
  line-height:1.8;
}

.result-head{
  text-align:center;
  padding:28px 20px;
  background:
    radial-gradient(circle at center,rgba(104,78,151,.25),transparent 58%),
    linear-gradient(145deg,rgba(30,29,57,.96),rgba(12,14,29,.96));
}

.result-head h2{
  font-size:25px;
  margin-top:14px;
}

.date-text{
  font-size:14px;
  color:#aaa5a0;
  letter-spacing:.12em;
}

.zodiac-badge{
  display:inline-block;
  margin:10px 0 4px;
  padding:7px 20px;
  border:1px solid rgba(220,193,127,.40);
  border-radius:30px;
  background:rgba(203,171,91,.09);
  color:#e7cf98;
  font-size:15px;
  letter-spacing:.1em;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(211,181,111,.15);
  padding-bottom:12px;
  margin-bottom:18px;
}

.section-title h2{margin:0}

.icon{
  font-size:25px;
  color:#e1c27e;
}

.tarot-box{text-align:center}

.tarot-box img{
  width:min(265px,72vw);
  max-height:430px;
  object-fit:contain;
  border-radius:9px;
  border:1px solid rgba(225,198,130,.28);
  box-shadow:
    0 12px 35px rgba(0,0,0,.48),
    0 0 0 6px rgba(255,255,255,.025);
  transition:transform .35s;
}

.tarot-box img.reversed{
  transform:rotate(180deg);
}

.position{
  font-weight:500;
  font-size:15px;
  margin:14px 0 5px;
  color:#d7bf89;
  letter-spacing:.1em;
}

.advice{
  background:linear-gradient(135deg,rgba(240,222,180,.06),rgba(120,101,154,.07));
  border-left:3px solid #b99a5b;
  padding:14px 16px;
  border-radius:5px;
  line-height:1.9;
  color:#ddd6ca;
}

.final{
  background:
    radial-gradient(circle at 50% 0%,rgba(177,143,72,.15),transparent 45%),
    linear-gradient(145deg,rgba(39,34,50,.98),rgba(17,17,30,.98));
  border:1px solid rgba(224,190,109,.55);
  text-align:center;
  padding:32px 24px;
}

.final h2{
  font-size:18px;
  color:#d9c28e;
}

.final-key{
  font-family:"Shippori Mincho","Yu Mincho",serif;
  font-size:clamp(31px,6vw,48px);
  font-weight:600;
  letter-spacing:.15em;
  margin:13px 0 17px;
  color:#f0d38e;
  text-shadow:0 2px 22px rgba(224,191,99,.22);
}

.final-text{
  max-width:720px;
  margin:0 auto;
  font-size:17px;
  line-height:2;
  color:#e4ded4;
}

.common{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:22px;
}

.common div{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(211,181,111,.13);
  border-radius:10px;
  padding:12px 8px;
  color:#c9c1b4;
  line-height:1.8;
}

.common b{
  color:#d9bf83;
  font-weight:500;
}

.small{
  font-size:13px;
  color:#9e9a94;
}

.hidden{display:none}

@media(max-width:700px){
  .container{padding:30px 10px 50px}
  h1{font-size:27px;letter-spacing:.08em}
  .subtitle{font-size:12px;letter-spacing:.14em}
  .grid{grid-template-columns:1fr}
  .common{grid-template-columns:1fr}
  .card{padding:20px 16px;border-radius:15px}
  .input-row>div{width:100%}
  input[type=date]{width:100%}
  button{width:100%}
  .tarot-box img{max-height:400px}
  .final-text{font-size:16px}
}
</style>
</head>

<div class="card">

function zodiacFor(date){
  const m=date.getMonth()+1,d=date.getDate();
  for(const z of zodiacData){
    if(z.name==="やぎ座"){
      if((m===12&&d>=22)||(m===1&&d<=19)) return z;
    }else{
      const [sm,sd]=z.start,[em,ed]=z.end;
      if((m===sm&&d>=sd)||(m===em&&d<=ed)||
         (sm<em&&m>sm&&m<em)) return z;
    }
  }
  return zodiacData[0];
}

function jdn(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const a=Math.floor((14-m)/12), y2=y+4800-a, m2=m+12*a-3;
  return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)
    -Math.floor(y2/100)+Math.floor(y2/400)-32045;
}

const stems=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const branches=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const animals=["ねずみ","うし","とら","うさぎ","たつ","へび","うま","ひつじ","さる","とり","いぬ","いのしし"];

function sexagenaryDay(date){
  // 2000-01-07を甲子日(0)とする基準
  return (jdn(date)-jdn(new Date(2000,0,7))+60)%60;
}

function yearPillar(date){
  // 四柱推命の年柱は立春付近で切り替わるため、ここでは簡易的に2月4日を境界とする
  let y=date.getFullYear();
  if(date.getMonth()+1<2 || (date.getMonth()+1===2&&date.getDate()<4)) y--;
  const i=((y-4)%60+60)%60;
  return {stem:stems[i%10],branch:branches[i%12],animal:animals[i%12],animalIndex:i%12};
}

  document.documentElement.lang=lang;

  document.getElementById("subtitle").textContent=t.subtitle;
  updateTodayDate();

  const firstCard=document.querySelector("#birth").closest(".card");
  firstCard.querySelector("h2").textContent=t.birthTitle;
  firstCard.querySelector("label").textContent=t.birthLabel;
  firstCard.querySelector("button").textContent=t.button;
  firstCard.querySelector(".note").textContent=t.note;

  document.querySelectorAll(".section-title h2")[0].textContent=t.tarot;
  document.querySelectorAll(".section-title h2")[1].textContent=t.horoscope;
  document.querySelectorAll(".section-title h2")[2].textContent=t.fourpillars;


  document.querySelector(".final h2").textContent=t.commonTitle;
  document.querySelector(".final .small").textContent=t.commonSub;

  const commonLabels=document.querySelectorAll(".common b");
  commonLabels[0].textContent=t.tarotCommon;
  commonLabels[1].textContent=t.zodiacCommon;
  commonLabels[2].textContent=t.pillarCommon;

  document.querySelectorAll("#results .card:last-child button").forEach(b=>b.textContent=t.repeat);

  document.getElementById("jaBtn").classList.toggle("active",lang==="ja");
  document.getElementById("enBtn").classList.toggle("active",lang==="en");

  // Refresh current result text in the selected language.
  if(!document.getElementById("results").classList.contains("hidden")){
    refreshDisplayedReading();
  }
}

function refreshDisplayedReading(){
  const t=I18N[currentLanguage];
  const input=document.getElementById("birth").value;
  if(!input)return;

  const parts=input.split("-");
  const birth=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
  const today=new Date();
  const zodiac=zodiacFor(birth);
  const dayIndex=sexagenaryDay(today);
  const yp=yearPillar(birth);
  const pp=simplePillarAdvice(dayIndex,zodiac,birth);
  const zodiacAdvice=zodiacAdviceFor(zodiac,birth,today);

  // Keep the already-selected tarot card and orientation across language changes.
  const card=(currentTarotReading && currentTarotReading.card) || tarotCards[0];
  const reversed=!!(currentTarotReading && currentTarotReading.reversed);

  document.getElementById("todayText").textContent =
    currentLanguage==="ja"
      ? `${today.getFullYear()}${t.yearText}${today.getMonth()+1}${t.monthText}${today.getDate()}${t.dayText}`
      : `${today.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})} — Today's Guidance`;

  document.getElementById("zodiacBadge").textContent=
    currentLanguage==="ja" ? zodiac.name : englishZodiacName(zodiac.name);

  document.querySelector("#results .result-head h2").textContent=t.todayNotice;

  document.getElementById("tarotPosition").textContent=
    reversed?t.positionReversed:t.positionUpright;

  document.getElementById("tarotName").textContent=
    currentLanguage==="ja" ? card.name : englishTarotNames[card.name];
  document.getElementById("tarotImage").alt=
    (currentLanguage==="ja" ? card.name : englishTarotNames[card.name]) +
    (reversed ? " — " + t.positionReversed : " — " + t.positionUpright);

  document.getElementById("tarotAdvice").textContent=
    currentLanguage==="ja"
      ? (reversed?card.reversed:card.upright)
      : englishTarotAdvice(card,reversed);

  document.getElementById("zodiacTitle").textContent=
    currentLanguage==="ja" ? zodiac.name : englishZodiacName(zodiac.name);
  document.getElementById("zodiacAdvice").textContent=
    currentLanguage==="ja" ? zodiacAdvice : englishZodiacAdvice(zodiac);

  document.getElementById("pillarsText").textContent=
    currentLanguage==="ja"
      ? `${t.pillarPrefix}${yp.stem}${yp.branch}（${yp.animal}）${t.pillarMiddle}${stems[dayIndex%10]}${branches[dayIndex%12]}${t.pillarSuffix}`
      : `Birth Year Pillar: ${englishPillarName(stems.indexOf(yp.stem),branches.indexOf(yp.branch))} — ${englishAnimals[yp.animalIndex]}. Today's Day Pillar: ${englishPillarName(dayIndex%10,dayIndex%12)}.`;

  document.getElementById("pillarAdvice").textContent=
    currentLanguage==="ja" ? pp.advice : englishPillarAdvice(pp);

  const finalKey=document.getElementById("finalKey");
  const existingKey=finalKey.dataset.jaKey || finalKey.textContent;
  finalKey.textContent=currentLanguage==="ja"
    ? existingKey
    : englishKey(existingKey);
  finalKey.dataset.jaKey=existingKey;

  const joeText=buildJoePoint({card:card,reversed:reversed},zodiac,zodiacAdvice,pp,birth,today,currentLanguage);
  document.getElementById("finalText").textContent=joeText;
  if(currentLanguage==="ja") document.getElementById("finalText").dataset.jaText=joeText;

  document.getElementById("commonTarot").textContent=
    currentLanguage==="ja" ? (reversed?"慎重に確認する":"落ち着いて進む") : (reversed?"Check carefully":"Move calmly");
  document.getElementById("commonZodiac").textContent=
    currentLanguage==="ja" ? zodiac.key : englishKey(zodiac.key);
  document.getElementById("commonPillar").textContent=
    currentLanguage==="ja" ? pp.theme : pp.theme;
}

function englishZodiacName(name){
  return {"おひつじ座":"Aries","おうし座":"Taurus","ふたご座":"Gemini","かに座":"Cancer",
  "しし座":"Leo","おとめ座":"Virgo","てんびん座":"Libra","さそり座":"Scorpio",
  "いて座":"Sagittarius","やぎ座":"Capricorn","みずがめ座":"Aquarius","うお座":"Pisces"}[name]||name;
}

function englishZodiacAdvice(z){
  const m={
    "おひつじ座":"Do not rush to conclusions. Listen to others until they finish speaking.",
    "おうし座":"Keep your own pace, but do not delay necessary responses to change.",
    "ふたご座":"Organize information before passing it on. Verify what you hear.",
    "かに座":"Do not decide from emotion alone. Avoid reading too much into other people's words.",
    "しし座":"Do not insist on being right. Give yourself room to step back.",
    "おとめ座":"Do not become too focused on details. Avoid delaying things by seeking perfection.",
    "てんびん座":"Do not adapt to everyone too much. Decide one thing that matters to you.",
    "さそり座":"Do not overthink one issue. Confirm what you do not know and move forward.",
    "いて座":"Do not make too many promises on impulse. Separate today's tasks from later ones.",
    "やぎ座":"Do not carry every responsibility alone. Ask others for help when needed.",
    "みずがめ座":"Do not decide only from your own viewpoint. Listen to people close to you.",
    "うお座":"Do not let your mood control important decisions. Wait until you are calm."
  };

}

function englishPillarAdvice(pp){
  return pp.advice
    .replace("細かな確認を省略しないこと。","Do not skip small checks.")
    .replace("結果を急がず、順番を守ること。","Do not rush results; follow the proper order.")
    .replace("強い言い方を避け、丁寧に伝えること。","Avoid harsh wording and communicate calmly.")
    .replace("無理を続けず、適度に休むこと。","Do not overdo it. Take appropriate breaks.")
    .replace("先に優先順位を決めること。","Set priorities before you begin.")
    .replace("一人で決めず、必要なら相談すること。","Do not decide everything alone; ask for advice when needed.");
}

function englishPillarShort(pp){
  return englishPillarAdvice(pp).split(".")[0];
}

function englishKey(k){
  return {
    "確認する":"Check first","急がない":"Do not rush","言葉に注意":"Watch your words",
    "力を抜く":"Relax","思い込みに注意":"Avoid assumptions","慎重にする":"Be cautious",
    "固執しない":"Stay flexible","受け止める":"Stay open","譲る":"Give way",
    "ほどほどに":"Keep it balanced","自分で決める":"Decide for yourself",
    "考えすぎない":"Do not overthink","広げすぎない":"Do not overextend",
    "抱え込まない":"Do not carry it alone","聞く":"Listen","落ち着く":"Stay calm"
  }[k]||k;
}

function englishCombined(dayIndex,cardName,zodiacName){
  const arr=[
    "Today, do not rush to an answer. Check the situation once before you act.",
    "Today, use calmer words and attitudes to avoid unnecessary misunderstandings.",
    "Today, follow the proper order instead of rushing. Handle one thing at a time.",
    "Today, do not carry everything alone. Ask for help when you need it.",
    "Today, check the facts before making a decision based on assumptions."
  ];
  return arr[(dayIndex+cardName.length+zodiacName.length)%arr.length];
}


function startReading(){
  const input=document.getElementById("birth").value;
  if(!input){alert(I18N[currentLanguage].enterBirth);return;}
  const parts=input.split("-");
  const birth=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
  const today=new Date();
  const zodiac=zodiacFor(birth);
  const tarot=chooseTarot(birth,today);
  currentTarotReading=tarot;
  const dayIndex=sexagenaryDay(today);
  const yp=yearPillar(birth);
  const pp=simplePillarAdvice(dayIndex,zodiac,birth);
  const zodiacAdvice=zodiacAdviceFor(zodiac,birth,today);
  const joeTextJa=buildJoePoint(tarot,zodiac,zodiacAdvice,pp,birth,today,"ja");

  document.getElementById("results").classList.remove("hidden");
  document.getElementById("todayText").textContent=
    `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日の注意点`;
  document.getElementById("zodiacBadge").textContent=zodiac.name;

  const img=document.getElementById("tarotImage");
  img.src=tarotImage(tarot.card);
  img.classList.toggle("reversed",tarot.reversed);
  img.alt=tarot.card.name+(tarot.reversed?"・逆位置":"・正位置");
  document.getElementById("tarotPosition").textContent=tarot.reversed?"逆位置":"正位置";
  document.getElementById("tarotName").textContent=tarot.card.name;
  document.getElementById("tarotAdvice").textContent=
    tarot.reversed?tarot.card.reversed:tarot.card.upright;

  document.getElementById("zodiacTitle").textContent=zodiac.name;
  document.getElementById("zodiacAdvice").textContent=zodiacAdviceFor(zodiac,birth,today);

  document.getElementById("pillarsText").textContent=
    `あなたの生年は「${yp.stem}${yp.branch}（${yp.animal}）」です。`+
    ` 今日の日柱は「${stems[dayIndex%10]}${branches[dayIndex%12]}」。`;
  document.getElementById("pillarAdvice").textContent=pp.advice;

  const finalKey = pp.theme;
  document.getElementById("finalKey").textContent=finalKey;
  document.getElementById("finalKey").dataset.jaKey=finalKey;
  document.getElementById("finalText").dataset.jaText=joeTextJa;
  document.getElementById("finalText").textContent=joeTextJa;
  document.getElementById("commonTarot").textContent=tarot.reversed?"慎重に確認する":"落ち着いて進む";
  document.getElementById("commonZodiac").textContent=zodiac.key;
  document.getElementById("commonPillar").textContent=pp.theme;

  refreshDisplayedReading();
  setTimeout(()=>document.getElementById("results").scrollIntoView({behavior:"smooth"}),100);
}

window.addEventListener("load",()=>{
  updateTodayDate();
  const d=new Date();
  const y=d.getFullYear()-50;
  document.getElementById("birth").value=
    `${y}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
});
